actors:
  name_of_actor:
    cmd: "pi --agent {{agent}} {{prompt}}"
    agent: heio-planner
    prompt: .pi/prompts/heio-planning.md
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: active
lanes:
# Pipeline lane
  workflow:
    type: pipeline
    concurrency: 2
    cooldown: 90s
    trigger:
      kind: ticket
      status: ready-for-agent
    stages:
      - stage: workflow-plan
        cmd: "pi --agent {{agent}} {{prompt}}"
        agent: heio-planner
        prompt: .pi/prompts/heio-planning.md
      - stage: workflow-tasker
        cmd: "pi --agent {{agent}} {{prompt}}"
        agent: heio-tasker
        prompt: .pi/prompts/heio-slice.md
      - stage: workflow-build
        cmd: "pi --agent {{agent}} {{prompt}}"
        agent: heio-builder
        prompt: .pi/prompts/heio-slice.md
      - stage: workflow-review
        cmd: "pi --agent {{agent}} {{prompt}}"
        agent: heio-verifier
        prompt: .pi/prompts/heio-slice.md

# Single action lane
  plan:
    type: single
    concurrency: 2
    cmd: "pi --agent {{agent}} {{prompt}}"
    agent: heio-planner
    prompt: .pi/prompts/heio-planning.md
    trigger:
      kind: ticket
      status: ready-for-agent
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: active
    backoff: 30s

  tasker:
    type: single
    concurrency: 2
    actor: name_of_actor
    trigger:
      kind: ticket
      status: ready-for-agent
    backoff: 30s
