# Littlepaw dest. Full file. No overlay. Dest copy is the runtime contract.
# Unattended heio-stack loop. Slice status ready means schedulable (replaces
# frozen). Then active / released / reviewing / met / failed. Tickets:
# ready-for-agent. Review misses mint ready-for-agent. Improve fills an empty
# queue from GOAL.md. cmd is pi --print so watch does not open a TUI.
concurrency: 1
folders:
  - path: .heio/tickets
    schema: ticket
    required: [id, status]
  - path: .heio/planning
    schema: planning
    required: [id, kind, status]
  - path: .heio/archive
    schema: archive
    required: [id]
  - path: .heio/quarantine
    schema: quarantine
    required: [origin-location, quarantined-at, fault]
lanes:
  - lane: plan
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-planner
    prompt: .pi/prompts/hivemind-plan.md
    trigger:
      kind: ticket
      status: ready-for-agent
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: active
    backoff: 15s
  - lane: tasker
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-tasker
    prompt: .pi/prompts/hivemind-tasker.md
    trigger:
      kind: slice
      status: ready
    scope:
      - .heio/planning
    claim-status: active
    backoff: 15s
  - lane: build
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: littlepaw-builder
    prompt: .pi/prompts/hivemind-build.md
    trigger:
      kind: slice
      status: active
    scope:
      - .heio/planning
      - simulation
      - entities
      - scenes
      - ui
      - core
      - tests
      - assets
      - data
    claim-status: active
    backoff: 15s
  - lane: review
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-verifier
    prompt: .pi/prompts/hivemind-review.md
    trigger:
      kind: slice
      status: released
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: reviewing
    mint-status: ready-for-agent
    backoff: 15s
  - lane: improve
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-triage
    prompt: .pi/prompts/hivemind-improve.md
    trigger:
      kind: improve
      status: ready
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: active
    backoff: 15s
