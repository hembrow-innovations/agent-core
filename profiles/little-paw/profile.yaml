# Littlepaw dest: heio-stack + Godot MCP.
# install . --profile little-paw
agents:
  - heio-triage
  - heio-planner
  - heio-tasker
  - heio-builder
  - heio-verifier
  - littlepaw-builder
  - blender-mcp
  - godot-mcp
prompts:
  - heio-wayfinder
  - heio-planning
  - heio-slice
  - swarm
  - verify-littlepaw
packages:
  - npm:pi-lens
  - npm:pi-subagents
  - npm:pi-mcp-adapter
  - npm:@inobit/pi-todo@0.1.1
  - npm:@juicesharp/rpiv-ask-user-question@2.8.0
  - local:@agentic-core/heio-boot
  - local:@agentic-core/heio-footer
  - local:@agentic-core/heio-onic
settings:
  toolDescriptionMode: compact
  defaultTools:
    - read
    - bash
    - edit
    - write
    - ls
system-prompt: little-paw
skills:
  - heio-stack
  - heio-wayfinder
  - heio-planning
  - heio-slice
  - unpark
  - docs
  - domain-modeling
  - tdd
  - behaviour-contracts
  - diagnose
  - oracle
  - godot-mono
  - blender-high-fidelity
  - mcp-worker
  - verify-littlepaw
