# Heio-stack template. Full file. No overlay. Dest copy is the runtime contract.
# Sealed: spec + EXPECT are immutable once written. Miss → new ticket, no
# unseal. Slice status ready means schedulable (replaces frozen). Then active /
# released / failed. Failed stays sealed. Tickets: ready-for-agent vs
# ready-for-human. Mint omitted. Doctor not shipped.
concurrency: 2
folders:
  - path: .heio/tickets
    schema: ticket
    required: [id, status]
  - path: .heio/planning
    schema: planning
    required: [id, kind, status]
  - path: .heio/archive
    schema: archive
    required: [id]
  - path: .heio/quarantine
    schema: quarantine
    required: [origin-location, quarantined-at, fault]
lanes:
  # Plan: one matching ticket per life. No match → exit. Does not invent work.
  - lane: plan
    cmd: "pi --agent {{agent}} {{prompt}}"
    agent: heio-planner
    prompt: .pi/prompts/heio-planning.md
    trigger:
      kind: ticket
      status: ready-for-agent
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: active
    backoff: 30s
  # Tasker: writes tasks.md once from a sealed spec. Separate life from Plan.
  - lane: tasker
    cmd: "pi --agent {{agent}} {{prompt}}"
    agent: heio-tasker
    prompt: .pi/prompts/heio-slice.md
    trigger:
      kind: slice
      status: ready
    scope:
      - .heio/planning
    claim-status: active
    backoff: 30s
  # Build: next unchecked task on a ready/active slice. Need: sealed spec +
  # EXPECT.
  - lane: build
    cmd: "pi --agent {{agent}} {{prompt}}"
    agent: heio-builder
    prompt: .pi/prompts/heio-slice.md
    trigger:
      kind: slice
      status: active
    scope:
      - .heio/planning
    claim-status: active
    backoff: 30s
  # Review: released work. Miss → new ticket at mint-status. Old slice sealed +
  # failed.
  - lane: review
    cmd: "pi --agent {{agent}} {{prompt}}"
    agent: heio-verifier
    prompt: .pi/prompts/heio-slice.md
    trigger:
      kind: slice
      status: released
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: released
    mint-status: ready-for-human
    backoff: 30s
