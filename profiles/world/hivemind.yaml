# World dest. Full file. No overlay. Dest copy is the runtime contract.
# Unattended novel loop. No interview. No ready-for-human.
# cmd list form. pi --print. --approve trusts the folder.
concurrency: 1
history: .heio/logs/hivemind.tsv
folders:
  - path: .heio/tickets
    schema: ticket
    required: [id, status]
  - path: .heio/planning
    schema: planning
    required: [id, kind, status]
  - path: .heio/archive
    schema: archive
    required: [id]
  - path: .heio/quarantine
    schema: quarantine
    required: [origin-location, quarantined-at, fault]
lanes:
  - lane: plan
    cmd:
      - pi
      - --print
      - --no-session
      - --approve
      - --exclude-tools
      - ask_user_question
      - --agent
      - "{{agent}}"
      - "--"
      - "@{{prompt}}"
    agent: heio-planner
    prompt: .pi/prompts/world-plan.md
    trigger:
      kind: ticket
      status: ready-for-agent
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: active
    backoff: 20s
  - lane: tasker
    cmd:
      - pi
      - --print
      - --no-session
      - --approve
      - --exclude-tools
      - ask_user_question
      - --agent
      - "{{agent}}"
      - "--"
      - "@{{prompt}}"
    agent: world-tasker
    prompt: .pi/prompts/world-tasker.md
    trigger:
      kind: slice
      status: ready
    scope:
      - .heio/planning
    claim-status: composing
    backoff: 20s
  - lane: draft
    cmd:
      - pi
      - --print
      - --no-session
      - --approve
      - --exclude-tools
      - ask_user_question
      - --agent
      - "{{agent}}"
      - "--"
      - "@{{prompt}}"
    agent: world-scribe
    prompt: .pi/prompts/world-draft.md
    trigger:
      kind: slice
      status: composing
    scope:
      - .heio/planning
      - 50 Book
    claim-status: composing
    backoff: 20s
  - lane: line
