# Todo-app dest. Full file. No overlay. Dest copy is the runtime contract.
# Unattended heio-stack loop. Slice status ready means schedulable (replaces
# frozen). Then active / released / reviewing / met / failed. Tickets:
# ready-for-agent vs ready-for-human. Mint omitted. Doctor not shipped.
# cmd is pi --print so watch does not open a TUI.
history: .heio/logs/hivemind.tsv
folders:
  - path: .heio/tickets
    schema: ticket
    required: [id, status]
  - path: .heio/planning
    schema: planning
    required: [id, kind, status]
  - path: .heio/archive
    schema: archive
    required: [id]
  - path: .heio/quarantine
    schema: quarantine
    required: [origin-location, quarantined-at, fault]
actors:
  pi-print:
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
lanes:
  plan:
    type: single
    concurrency: 1
    actor: pi-print
    agent: heio-planner
    prompt: prompts/hivemind-plan.md
    trigger:
      kind: ticket
      status: ready-for-agent
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: active
    backoff: 15s
  tasker:
    type: single
    concurrency: 1
    actor: pi-print
    agent: heio-tasker
    prompt: prompts/hivemind-tasker.md
    trigger:
      kind: slice
      status: ready
    scope:
      - .heio/planning
    claim-status: active
    backoff: 15s
  build:
    type: single
    concurrency: 1
    actor: pi-print
    agent: heio-builder
    prompt: prompts/hivemind-build.md
    trigger:
      kind: slice
      status: active
    scope:
      - .heio/planning
      - src
      - tests
      - index.html
    claim-status: active
    backoff: 15s
  review:
    type: single
    concurrency: 1
    actor: pi-print
    agent: heio-verifier
    prompt: prompts/hivemind-review.md
    trigger:
      kind: slice
      status: released
    scope:
      - .heio/planning
      - .heio/tickets
    claim-status: reviewing
    mint-status: ready-for-human
    backoff: 15s
